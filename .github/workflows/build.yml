name: Build LUX APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          test -f lux_app.zip || { echo "lux_app.zip not found in repo root"; exit 1; }
          mkdir -p _src
          unzip -oq lux_app.zip -d _src
          ls _src/lux_app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        working-directory: _src/lux_app
        run: |
          flutter --version
          flutter create --platforms=android --org com.lux --project-name lux_app /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Prepare Android project
        working-directory: _src/lux_app
        run: python3 tool/ci_prepare.py

      - name: Get packages
        working-directory: _src/lux_app
        run: flutter pub get

      - name: Unit tests
        working-directory: _src/lux_app
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        working-directory: _src/lux_app
        run: flutter build apk --release

      - name: Sign APK
        working-directory: _src/lux_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tool/sign_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lux-apk
          path: _src/lux_app/build/app/outputs/flutter-apk/lux.apk
